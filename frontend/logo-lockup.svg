<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="3JN Travel">
  <defs>
    <linearGradient id="lkGold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFDD74"/>
      <stop offset="0.45" stop-color="#F4B71C"/>
      <stop offset="1" stop-color="#E0930E"/>
    </linearGradient>
  </defs>

  <!-- gold swoosh, tucked just under the wordmark -->
  <path d="M64 208 C 188 260, 336 256, 440 150 C 352 214, 200 214, 92 186 Z" fill="url(#lkGold)"/>

  <!-- climbing airliner, top-right -->
  <g transform="translate(398 40) rotate(42) scale(1.5)">
    <path d="M32 2 C34 2 36 6 36 14 L36 24 L60 40 L60 46 L36 38 L36 52 L44 60 L44 63 L32 58 L20 63 L20 60 L28 52 L28 38 L4 46 L4 40 L28 24 L28 14 C28 6 30 2 32 2 Z" fill="url(#lkGold)"/>
  </g>

  <!-- sparkles, left of the wordmark -->
  <path d="M44 150 C46 164 50 168 64 170 C50 172 46 176 44 190 C42 176 38 172 24 170 C38 168 42 164 44 150 Z" fill="url(#lkGold)"/>
  <path d="M26 196 C27.5 205 30 207.5 39 209 C30 210.5 27.5 213 26 222 C24.5 213 22 210.5 13 209 C22 207.5 24.5 205 26 196 Z" fill="url(#lkGold)"/>

  <!-- wordmark (inherits page colour: navy on light, platinum on dark) -->
  <text x="238" y="190" text-anchor="middle" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-size="180" letter-spacing="-6" fill="currentColor">3JN</text>
  <text x="244" y="300" text-anchor="middle" font-family="'Arial','Helvetica Neue',sans-serif" font-weight="800" font-size="46" letter-spacing="20" fill="currentColor">TRAVEL</text>
</svg>
